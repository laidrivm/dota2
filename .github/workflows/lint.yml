name: Lint

# `workflow_call` alongside it, so `.github/workflows/deploy.yml` can depend on
# this workflow against the commit on `main` rather than trusting a run over
# the pull request's own object. It changes nothing about what runs here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow's own name, written out rather than `${{ github.workflow }}`,
  # which in a called workflow is the *caller's* name: the three checks the
  # deploy calls would share one group and cancel each other, and a cancelled
  # job fails the `needs:` that was gating on it. On a pull request the two
  # spellings are the same string.
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  yaml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # check-yaml.ts only imports the "bun" builtin — no install needed.
      - run: bun run lint:yaml

  suppressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # no-suppressions.ts imports node builtins and reads git — no install
      # needed.
      - run: bun run lint:suppressions

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `gitleaks git` reads history through `git log -p`, and the default
          # shallow clone hides every commit but the last — a secret added and
          # then deleted on the branch would pass.
          fetch-depth: 0
      - uses: docker://zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          # `git` rather than `dir`: it reads tracked content only, where `dir`
          # also walks gitignored files that exist for one author and in no
          # clone. `-v` names the file and line, and `--redact` keeps the secret
          # itself out of a build log this public repository shows to anyone.
          args: git . -v --redact --no-banner
