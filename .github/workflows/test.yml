name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Coverage is visibility, not a gate: the number is read from this log,
      # no threshold fails the build. `build.test.ts` spawns a real
      # `bun run build`, so this job needs the build to work.
      # `db.test.ts` runs here too and skips: this job supplies no connection
      # string, and the job below is the one that owns those cases.
      - run: bun run test:coverage

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest as every action here is; `18-alpine` is the tag it
        # was resolved from, and Postgres 18.6 is what it ran.
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # `DATABASE_REQUIRED` is what makes this job evidence: without it a suite
      # that skipped and one that passed both report green, and this job exists
      # for the cases that only run with a database behind them.
      - run: bun test db.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DATABASE_REQUIRED: "1"
