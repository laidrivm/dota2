name: Test

# `workflow_call` alongside it, so `.github/workflows/deploy.yml` can depend on
# this workflow against the commit on `main` rather than trusting a run over
# the pull request's own object. It changes nothing about what runs here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow's own name, written out rather than `${{ github.workflow }}`,
  # which in a called workflow is the *caller's* name: the three checks the
  # deploy calls would share one group and cancel each other, and a cancelled
  # job fails the `needs:` that was gating on it. On a pull request the two
  # spellings are the same string.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Coverage is visibility, not a gate: the number is read from this log,
      # no threshold fails the build. `build.test.ts` spawns a real
      # `bun run build`, so this job needs the build to work.
      # The database-backed files run here too and skip: this job supplies no
      # connection string, and the job below is the one that owns those cases.
      - run: bun run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The runner ships a daemon, so nothing here starts one. What this job
      # adds over `coverage` above is `DOCKER_REQUIRED`, which
      # `scripts/test-docker.sh` sets: without it a suite that skipped and one
      # that passed both report green, and this job exists for the cases that
      # only run with an image behind them.
      #
      # It builds that image from the checkout, which installs twice and
      # bundles the app inside the container — most of this job's minutes, and
      # the only way the assertions are about an image rather than about a
      # Dockerfile's text.
      - run: bun run test:docker

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest as every action here is; `18-alpine` is the tag it
        # was resolved from, and Postgres 18.6 is what it ran.
        # Nothing raises this pin. Dependabot's `github-actions` ecosystem
        # updates only `owner/repo@ref` and states that container registry URLs
        # are unsupported; its `docker` ecosystem reads Dockerfiles and
        # Kubernetes manifests, neither of which this is. That ecosystem is
        # now enabled — `.github/dependabot.yml` carries it, for the
        # `Dockerfile` at the root — and this pin is still outside what it
        # reads, a service image in a workflow being neither of those two
        # kinds of file. Moving it stays a hand edit.
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: postgres
        # The probe goes over TCP rather than the socket: the entrypoint runs
        # initdb against a temporary server bound to the socket alone, so a
        # socket probe reports ready while connections opened on it are about
        # to be closed. The steps below take long enough to hide that today,
        # which is luck rather than design. A comment cannot live inside the
        # block scalar under it — it would be folded into the option string.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # `DATABASE_REQUIRED` is what makes this job evidence: without it a suite
      # that skipped and one that passed both report green, and this job exists
      # for the cases that only run with a database behind them.
      #
      # The whole suite rather than the database-backed files by name: a named
      # list drifts silently, because a file added to it later would skip here
      # and report the same green as one that ran. The cost is that this job
      # now runs `build.test.ts` too, which spawns a real `bun run build` and
      # is most of the suite's twenty seconds — paid to keep the set of
      # database-backed files out of a list somebody has to maintain.
      - run: bun test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # The suites delete rows, and this database is a service container
          # that lives for the length of the job — which is the only kind they
          # are allowed to run against.
          DATABASE_DISPOSABLE: "1"
          DATABASE_REQUIRED: "1"
