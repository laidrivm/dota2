name: Mutation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Stryker is the one tool here that needs Node. Without it on PATH, bunx
      # runs bin/stryker.js on Bun instead of honouring its node shebang, and
      # the instrumenter dies on @babel/generator's CommonJS default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: bun install --frozen-lockfile
      # Staleness is prevented here rather than checked for: the check cannot
      # tell last run's report from this one's, and an absent report fails it.
      - run: rm -rf reports/mutation
      # Three commands, not one: a crashed Stryker fails the job through the
      # shell, so the check never has to tell that apart from an exceeded floor.
      - run: bunx --no-install stryker run
      - run: bun scripts/mutation-floor.ts
