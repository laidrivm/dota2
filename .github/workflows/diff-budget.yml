name: Diff budget

on:
  # `edited` alongside the defaults, because the override this gate honours
  # lives in the pull request body: without it a marker added after the last
  # push is never read, and the check reports a verdict on a body that is no
  # longer there.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      # `<base>...HEAD` needs the merge base, which a shallow clone does not
      # carry. The script exits non-zero when it cannot measure, so a missing
      # history fails this check rather than quietly retiring it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The script ships in the harness package and reads its exclusions from
      # package.json with bun, so both are installed first.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The base is passed as a commit, not as `origin/<ref>`: the checked-out
      # merge commit has the base as an ancestor, so the SHA resolves without
      # depending on which remote-tracking refs the checkout happened to fetch.
      # Neither value is interpolated into the script text: the body is read
      # from the environment, and the SHA is expanded by the shell from an
      # environment variable into an argument — a pull request body is
      # attacker-controlled text.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash node_modules/harness/bun/diff-budget.sh "$BASE_SHA"
