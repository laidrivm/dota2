name: E2E

# `workflow_call` alongside it, so `.github/workflows/deploy.yml` can depend on
# this workflow against the commit on `main` rather than trusting a run over
# the pull request's own object. It changes nothing about what runs here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow's own name, written out rather than `${{ github.workflow }}`,
  # which in a called workflow is the *caller's* name: the three checks the
  # deploy calls would share one group and cancel each other, and a cancelled
  # job fails the `needs:` that was gating on it. On a pull request the two
  # spellings are the same string.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      # A green run needs no artifacts.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
