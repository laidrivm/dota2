version: 2

# Dependabot, not Renovate: it is first-party, so no third-party GitHub App
# gets write access to this repository. The trade is no dependency dashboard
# and no lockfile maintenance. What that loses is a locked transitive version
# aging into an advisory unseen, and the nightly `bun audit` reports that.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Match bunfig.toml minimumReleaseAge (3 days): let poisoned releases
    # be caught and unpublished before an update PR adopts them.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  # Parses the manifest's dependency sections and the lockfile but never
  # `overrides`, so nothing here raises the ones for `qs` and `fast-uri` — both
  # reached only under `@stryker-mutator/core`. Raise one by hand, exact, when
  # .github/workflows/audit.yml reports it in an advisory's range.
  - package-ecosystem: "bun"
    directory: "/"
    # Raise the exact pin to the new version (bunfig.toml exact = true).
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      dependencies:
        update-types: ["minor", "patch"]

  # What raises the base image digest the Dockerfile pins. Without this entry
  # the digest is a pin nobody moves, and a stale one reads exactly like a
  # fresh one — so checks/container-image.test.ts fails if the entry goes
  # missing, names another directory, or takes terms of its own.
  #
  # Same schedule and cooldown as the two above, read off them by that check
  # rather than restated anywhere.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      images:
        patterns: ["*"]

  # Separate from the entry above, and not a duplicate of it: `docker` and
  # `docker-compose` are two package managers to Dependabot, and the first does
  # not read compose files. Without this the Postgres digest in
  # docker-compose.yml would be a pin nothing raises.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      images:
        patterns: ["*"]
